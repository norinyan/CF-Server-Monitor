# 本项目通过 Wrangler CLI 部署；不要启用 GitHub Actions 覆盖此配置。
name = "cf-server-monitor"
account_id = "abfe04c1336997ad936143889c9a964c"
workers_dev = true
preview_urls = false
routes = [{ pattern = "vps.norin.me", custom_domain = true, zone_name = "norin.me" }]
main = "src/index.js"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

keep_vars = true

# 定时任务配置（UTC）
# - 每分钟：执行离线节点、资源告警
# - 每小时：合并执行其他定时任务（表轮换、旧表清理、按配置时区/小时触发服务器到期检测）
# - 注意同步修改deploy和index.js scheduled函数里面的值
[triggers]
crons = ["*/1 * * * *", "0 * * * *"]

[assets]
directory = "./dist"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "server-monitor-db"
database_id = "68996ed5-2efa-4ecc-bf4c-55480611a6b7"

# Durable Objects：实时指标广播中心
# 首次部署由下面的 SQLite migration 自动创建 namespace，兼容 Workers Free。
[[durable_objects.bindings]]
name = "METRICS_BROADCASTER"
class_name = "MetricsBroadcaster"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MetricsBroadcaster"]

# 开发服务器配置
[dev]
port = 8787
local_protocol = "https"
